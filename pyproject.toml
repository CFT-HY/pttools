# The uv build backend is not the default, so it has to be set explicitly.
# Without a build-system table, uv would fall back to setuptools.
# The upper bound follows the uv versioning policy, so that the package keeps building when new versions are released.
# https://docs.astral.sh/uv/concepts/build-backend/
[build-system]
requires = ["uv_build >= 0.12.17, < 0.13"]
build-backend = "uv_build"

[project]
name = "pttools-gw"
version = "0.10.0"
description = "PTtools simulation framework for phase transitions in the early universe"
readme = "README.md"
# PTtools is licensed under the MIT License in accordance with the University of Helsinki recommendations.
# https://www.helsinki.fi/en/helsinki-university-library/library-researchers/copyright-and-licenses
# "We primarily recommend the MIT licence."
# https://blogs.helsinki.fi/thinkopen/open-source-at-the-university-of-helsinki/
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cosmology",
    "phase transitions",
    "gravitational waves",
    "hydrodynamics",
    "relativistic hydrodynamics",
    "sound shell model"
]
# When updating these, also update acknowledgements.rst, AUTHORS, CITATION.cff and codemeta.json
authors = [
    {name = "Mark Hindmarsh", email = "mark.hindmarsh@helsinki.fi"},
    {name = "Chloe Hopling", email = "c.hopling@sussex.ac.uk"},
    {name = "Mika Mäki", email = "mika.x.maki@helsinki.fi"},
    {name = "Lorenzo Giombi", email = "lorenzo.giombi@helsinki.fi"}
]
maintainers = [
    {name = "Mark Hindmarsh", email = "mark.hindmarsh@helsinki.fi"},
    {name = "Mika Mäki", email = "mika.x.maki@helsinki.fi"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Matplotlib",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 1 - Unstable",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
# Note: LISA ProtoLab uses Python 3.13, and PTtools should therefore probably stay compliant with it.
# https://gitlab.esa.int/mika.x.maki/lisa-protolab
requires-python = ">= 3.12"
# dynamic = ["version"]

# These are the version ranges that PTtools is compatible with.
# The exact versions that are used for development and testing are pinned in uv.lock,
# which is updated with "uv lock --upgrade".
# When updating these, also update environment.yml.
# Please also ensure that compatible versions are available in LISA ProtoLab.
dependencies = [
    # h5py does not yet support free-threading.
    # https://github.com/h5py/h5py/issues/2475
    # https://docs.h5py.org/en/latest/threads.html#free-threading
    "h5py >= 3.16.0",
    # For Plotly image export
    "kaleido >= 1.3.0",
    # Matplotlib 3.9.1 wheels are broken
    # https://pypi.org/project/matplotlib/3.9.1/
    "matplotlib >= 3.10.9",
    # Numba 0.55 breaks the unit tests
    # https://github.com/numba/numba/issues/7751
    # Numba does not yet support free-threading.
    # https://github.com/numba/numba/issues/9928
    # If you're using an old version of Numba and get the error:
    # "create_target_machine() got an unexpected keyword argument 'jitdebug'"
    # then you may have to downgrade llvmlite to 0.32.1
    # https://github.com/rapidsai/cuml/issues/2389#issuecomment-642645437
    "numba >= 0.65.1",
    "numpy >= 2.4.6",
    # As of 2026-05, Orjson does not yet support free-threading.
    "orjson >= 3.11.9",
    "plotly >= 6.6.0",
    "scipy >= 1.17.1",
]

[project.optional-dependencies]
numbalsoda = ["numbalsoda >= 0.3.4"]
# Intel SVML for Numba
# https://pypi.org/project/icc-rt/
# https://pypi.org/project/intel-cmplr-lib-rt/
# https://numba.readthedocs.io/en/stable/user/performance-tips.html#intel-svml
# TBB can be used to speed up Numba threading
# https://pypi.org/project/tbb/
# https://numba.pydata.org/numba-doc/latest/user/threading-layer.html#which-threading-layers-are-available
# These libraries are available for x86-64 only.
# The architecture has to be matched positively, as its name depends on the platform:
# Linux and macOS report "x86_64", Windows reports "AMD64",
# and the ARM architecture is "arm64" on macOS, "aarch64" on Linux and "ARM64" on Windows.
performance = [
    # As of 2026-03, this is the latest version with support for macOS.
    "icc-rt >= 2019.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    # This replaces icc-rt for Windows and Linux.
    "intel-cmplr-lib-rt >= 2025.3.3; (platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'",
    # As of 2026-03, this is the latest version with support for macOS.
    "intel-openmp >= 2023.2.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    # As of 2026-03, this is the latest version with support for macOS.
    "tbb >= 2021.10.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]

[project.urls]
documentation = "https://pttools.readthedocs.io"
issues = "https://github.com/CFT-HY/pttools/issues"
repository = "https://github.com/CFT-HY/pttools"

# Dependency groups (PEP 735) for development and documentation.
# These are installed by "uv sync" and are not included in the published package.
# The exact versions are pinned in uv.lock.
[dependency-groups]
dev = [
    "allure-pytest >= 2.16.0",
    "colorama >= 0.4.6",
    # "hypothesis[numpy] >= 6.155.1",
    "pandas >= 3.0.5",
    "pandas-stubs >= 3.0.3.260530",
    # For Numba system info
    "psutil >= 7.2.2",
    "pyan3 >= 2.6.2",
    "pyinstrument >= 5.1.2",
    "pyrefly >= 1.2.0",
    # Pylint is no longer used for linting, but its Pyreverse tool is used for generating the UML diagrams.
    "pylint >= 4.0.6",
    "pytest >= 9.1.1",
    "pytest-cov >= 7.1.0",
    "pytest-html >= 4.2.0",
    "pytest-split >= 0.11.0",
    "pytest-xdist[psutil] >= 3.8.0",
    "ruff >= 0.16.6",
    "scipy-stubs >= 1.18.0.1",
    "sympy >= 1.14.0",
    # For checking the packages built with "uv build"
    "twine >= 6.2.0",
    "types-colorama >= 0.4.15.20260508",
    "types-defusedxml >= 0.7.0.20260504",
    "types-docutils >= 0.22.3.20260724",
    "types-psutil >= 7.2.2.20260518",
    "yappi >= 1.7.6",
]
docs = [
    # Joblib is required for Sphinx-Gallery parallelism
    "joblib >= 1.5.3",
    "memory-profiler >= 0.61.0",
    # "myst-parser",
    "sphinx >= 9.1.0",
    "sphinxcontrib-video >= 0.4.2",
    # "sphinx-autodoc-typehints >= 3.9.7",
    "sphinx-gallery >= 0.21.0",
    "sphinx-math-dollar >= 1.3",
    "sphinx-rtd-theme >= 3.1.0",
]

[tool.uv]
# "uv sync" installs the full development environment, including the tools for building the documentation.
# Use "uv sync --no-group docs" to skip the documentation dependencies.
default-groups = ["dev", "docs"]

# The package name "pttools-gw" differs from the module name, and the module is in the repository root
# instead of the default "src" directory.
[tool.uv.build-backend]
module-name = "pttools"
module-root = ""

[tool.coverage.run]
branch = true
# command_line = "manage.py test --noinput --parallel"
concurrency = [
    "thread",
    "multiprocessing"
]
source = ["."]
omit = [
    "**/.venv/*",
    "**/envs/*",
    "**/venv/*",
    "docs/conf.py"
]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]
show_missing = true

[tool.pyrefly]
project-includes = [
    "conftest.py",
    "docs",
    "examples",
    "pttools",
    "tests"
]
project-excludes = [
    "**/_build*",
    "**/auto_examples*",
    # This file is unmaintained and depends on a thermo module that is not in this repository.
    "examples/entropy/p_s_scan_dev.py",
    "**/__pycache__/**",
    "**/*venv/**",
    "**/.[!/.]*"
]
ignore-missing-imports = [
    "h5py.*",
    "kaleido.*",
    "numbalsoda.*",
    "NumbaLSODA.*",
    "plotly.*",
    "sphinx_gallery.*",
    "sympy.*",
    "yappi.*"
]
# The type stubs shipped with Numba are incomplete:
# - The jit options of the _JITOptions TypedDict are missing e.g. "cache" and "nopython".
# - numba.prange is not declared to be iterable.
# - Decorating a generic function with numba.njit resolves its type parameters to Never.
# Therefore, the stubs are skipped until these have been fixed upstream.
replace-imports-with-any = [
    "numba.*"
]

[tool.pytest.ini_options]
# On clusters "--numprocesses=auto" creates processes according to the total number of CPU cores
# instead of the number of cores available to the job.
# Therefore, it may be wise to set the number of processes manually.
addopts = [
    "--alluredir=test-results/allure",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=json",
    "--cov-report=term",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--durations=50",
    "--durations-min=1.0",
    # The tests that have to be run on the same worker are grouped with the "xdist_group" marker.
    # See the "pytest_collection_modifyitems" hook in conftest.py for details.
    "--dist=loadgroup",
    "--html=test-results/html/test-report.html",
    "--numprocesses=auto"
]
norecursedirs = "test_data"
# python_paths = "tests"
testpaths = [
    "tests"
]
# log_cli = true
# log_cli_level = "INFO"

[tool.ruff]
line-length = 120
extend-exclude = [
    "call_graphs",
    "dev",
    "docs/_build",
    "docs/auto_examples",
    "docs/gen_modules",
    "htmlcov",
    "logs",
    "test-results"
]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "NPY",   # NumPy-specific rules
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W"      # pycodestyle warnings
]
ignore = [
    "ARG001",   # unused-function-argument
    # Writing the missing docstrings is a documentation task rather than a linting one.
    "D101",     # undocumented-public-class
    "D102",     # undocumented-public-method
    "D103",     # undocumented-public-function
    "D105",     # undocumented-magic-method
    "D106",     # undocumented-public-nested-class
    "D107",     # undocumented-public-init
    # Most of the docstrings of PTtools have a multi-line summary or start on the line
    # after the opening quotes, so this cannot be fixed mechanically.
    "D205",     # missing-blank-line-after-summary
    # Many docstrings describe a physical quantity with a noun phrase instead of a verb.
    "D401",     # non-imperative-mood
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "N802",     # invalid-function-name
    "N803",     # invalid-argument-name
    "N806",     # non-lowercase-variable-in-function
    # The tests are based on unittest.TestCase, and therefore they use its assertion methods.
    "PT009",    # pytest-unittest-assertion
    "PT027"     # pytest-unittest-raises-assertion
]
# The en dash is used in the names of the physical laws, and the low asterisk in the unicode labels.
allowed-confusables = ["–", "⁎"]
# The equivalent of the Pylint option "dummy-variables-rgx"
dummy-variable-rgx = "^(_+$|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?$)|dummy|ignored_|unused_)"

[tool.ruff.lint.flake8-unused-arguments]
# Allow unused variadic names like *args and *kwargs
ignore-variadic-names = true

[tool.ruff.lint.isort]
# Sort "import x" and "from x import y" together.
force-sort-within-sections = true

# These correspond to the "good-names" of the previously used Pylint configuration.
[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "i", "j", "k", "ex", "Run", "_", "_qT_array", "a", "alN", "am", "ap", "ax_dg_dT", "A", "A2", "A2_2d_array_z",
    "A2_approx", "A2_lookup", "ax", "b", "b_R", "c", "cs", "cs2", "CPU_AFFINITY", "data_T_b", "data_T_b_log",
    "data_T_s", "data_T_s_log", "de", "dge_dT", "dgp_dT", "dgs_dT", "dq", "du", "dv", "dw", "D", "Delta_bar",
    "DifferentialCFunc", "DifferentialSolveIVP", "DE_Method", "e", "eb", "ek", "expected_Ubarf2", "E", "f", "f1",
    "f2", "Fgw0", "g", "ge", "getKandWow", "gp", "gs", "G", "Gamma", "H", "HLf", "Htau_nl", "H_n", "it", "I_hi",
    "J", "kappaNuModel", "Kint", "Krf", "Ksh", "K_frac", "ls", "L", "Lf", "mu", "n", "nu", "nt", "nx", "nz", "N",
    "Np", "N_acc", "N_AE", "Omgw", "p", "p1", "p2", "psutil", "Pgw", "Pgw_high", "Pgw_int", "Pgw_low", "Psi_n",
    "Pv_data", "P_acc", "P_oms", "P_v_lookup", "qRstar", "qT", "qT_lookup", "r", "R", "R_star", "R_AE", "R_LISA",
    "s", "sqrt_K", "S", "S_gb", "S_sw_approx", "S_AE", "S_AE_approx", "S_I", "t", "tn", "T", "Tb", "Tm", "Tm_sh",
    "Tn", "Tn_manual_override", "Tn_override", "Tp", "Ts", "Ttilde", "T_center", "T_crit", "T_is_physical", "T_max",
    "T_min", "T_n", "T_nucl", "T_ref", "u", "Ubarf", "Ubarf2", "Ubarf_2_ssm", "v", "v0", "v1", "v2", "vb", "vf",
    "vm", "vp", "vw", "V", "V2_pow_v", "Vm", "Vp", "V_s", "V_s_default", "V_b", "w", "w0", "w1", "w2", "wb", "wf",
    "wm", "wn", "wp", "W", "W_abs2", "x", "x2", "xi", "y", "y0", "z", "z0", "z1",
]

# The submodules of PTtools are re-exported by the __init__.py files with wildcard imports.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # unused-import
    "F403"   # undefined-local-with-import-star
]
# The Sphinx configuration variables shadow builtins and are not documented individually.
"docs/conf.py" = [
    "A001"  # builtin-variable-shadowing
]
# The module docstring of a Sphinx-Gallery example has to start with an RST section title,
# which cannot end with a period and has to be followed directly by its underline.
"examples/**" = [
    "D205",  # missing-blank-line-after-summary
    "D400"   # missing-trailing-period
]

[tool.ruff.lint.pydocstyle]
# This should be set to "sphinx" once it's supported.
# https://github.com/astral-sh/ruff/issues/6606
convention = "pep257"
