# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    # Read the Docs requires the Python version to be specified here and does not read the .python-version file.
    # Keep this in sync with .python-version, as otherwise uv would download another Python version for the build.
    python: "3.14"
  apt_packages:
    - cloc
    - gfortran
    - libtbb12
    - optipng
    - patchelf
    # Shared libraries of Chrome, which Kaleido needs for exporting Plotly figures.
    # The list is from choreographer.browsers._errors.BrowserDepsError.
    - libasound2
    - libatk-bridge2.0-0
    - libcairo2
    - libcups2
    - libgbm1
    - libnss3
    - libpango-1.0-0
    - libxcomposite1
    - libxdamage1
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  jobs:
    post_install:
      # Read the Docs accepts only package names from the Ubuntu repositories in apt_packages, not URLs of .deb files,
      # and the build jobs run without root access. Therefore, Chrome is installed with Kaleido,
      # which downloads Chrome for Testing to the user data directory, where Kaleido finds it automatically.
      - "$READTHEDOCS_VIRTUALENV_PATH/bin/kaleido_get_chrome"

# Optionally build your docs in additional formats such as PDF
formats: all

# Install the dependencies with uv according to uv.lock
# https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
python:
  install:
    - method: uv
      command: sync
      groups: all
      extras: all

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
