# This action is also used by other repositories, such as PTPlot (CFT-HY/pttools/.github/actions/setup-env@dev).
# Keep its inputs backwards compatible.
name: Setup uv and Python environment
description: >-
  Install uv and Python, create and activate a virtual environment, and install the locked dependencies with uv sync.
  The repository has to be checked out first.
inputs:
  apt-packages:
    description: >-
      Additional apt packages to install, separated by spaces, e.g. "ffmpeg".
      This is supported only on Linux.
    required: false
    default: ""
  install-patchelf:
    description: >-
      Install patchelf on Ubuntu >= 26.04, which PTtools uses for clearing the executable stack flag of NumbaLSODA,
      as glibc >= 2.41 refuses to load shared libraries that require an executable stack,
      and execstack is not available on Ubuntu >= 26.04.
      This has no effect on older Ubuntu versions or on other operating systems.
    required: false
    default: "true"
  check-tbb:
    description: >-
      Check that a TBB library compatible with Numba can be loaded with "python -m pttools.speedup.tbb",
      and fail if not. On CPU architectures other than x86-64, for which the tbb package is not available,
      the check only prints a note.
    required: false
    default: "true"
  generate-reference-data:
    description: Generate the reference data of PTtools, which is used by its unit tests and examples.
    required: false
    default: "false"
  print-numba-sysinfo:
    description: Print the output of "numba --sysinfo" and save it to numba-sysinfo.txt.
    required: false
    default: "true"
  python-version:
    description: The Python version. By default, uv reads it from the .python-version file.
    required: false
    default: ""
  uv-sync-args:
    description: Additional arguments for "uv sync --locked", e.g. "--all-extras --no-group docs".
    required: false
    default: ""
outputs:
  uv-version:
    description: The installed uv version
    value: ${{ steps.setup-uv.outputs.uv-version }}
  python-version:
    description: The full version of the Python of the virtual environment, e.g. "3.14.0"
    value: ${{ steps.versions.outputs.python-version }}
runs:
  using: composite
  steps:
    - name: Install apt packages
      if: inputs.apt-packages != '' || (runner.os == 'Linux' && inputs.install-patchelf == 'true')
      shell: bash
      # The Ubuntu version is read from /etc/os-release, which has e.g. ID=ubuntu and VERSION_ID="26.04".
      # The versions are compared with dpkg, which is available on all Ubuntu versions.
      run: |
        if [ "${INSTALL_PATCHELF}" = "true" ] && [ -f /etc/os-release ]; then
          OS_ID="$(. /etc/os-release && echo "${ID}")"
          OS_VERSION_ID="$(. /etc/os-release && echo "${VERSION_ID}")"
        fi
        if [ "${OS_ID:-}" = "ubuntu" ] && dpkg --compare-versions "${OS_VERSION_ID}" ge "26.04"; then
          APT_PACKAGES="${APT_PACKAGES} patchelf"
        fi
        if [ -z "${APT_PACKAGES// /}" ]; then
          echo "No apt packages to install."
          exit 0
        fi
        sudo apt-get update
        # APT_PACKAGES is intentionally unquoted to split it into separate arguments.
        # shellcheck disable=SC2086
        sudo apt-get install -y ${APT_PACKAGES}
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
        INSTALL_PATCHELF: ${{ inputs.install-patchelf }}
    - name: Setup uv
      id: setup-uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # This overrides the version of the .python-version file, if given.
        python-version: ${{ inputs.python-version }}
        activate-environment: true
    - name: Print uv and Python versions
      id: versions
      shell: bash
      # The python-version output of setup-uv is not used, since it's equal to the python-version input if given,
      # e.g. "3.13", instead of the full version of the installed Python.
      # The output of "python -V" is of the form "Python 3.14.0".
      # The carriage return is removed, since it's included on Windows.
      run: |
        PYTHON_VERSION="$(python -V | tr -d '\r')"
        PYTHON_VERSION="${PYTHON_VERSION#Python }"
        echo "uv ${UV_VERSION}"
        echo "Python ${PYTHON_VERSION}"
        echo "python-version=${PYTHON_VERSION}" >> "${GITHUB_OUTPUT}"
      env:
        UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
    - name: Install requirements
      shell: bash
      # SYNC_ARGS is intentionally unquoted to split it into separate arguments.
      run: uv sync --locked ${SYNC_ARGS}
      env:
        SYNC_ARGS: ${{ inputs.uv-sync-args }}
    - name: Print Numba sysinfo
      if: inputs.print-numba-sysinfo == 'true'
      shell: bash
      # Numba is called as a Python module, since on macOS its script is not executable by default.
      # The TBB library of the tbb package is not on the default library search path,
      # so Numba reports it as unavailable here. PTtools loads it from the virtual environment instead,
      # which is verified by the TBB check.
      run: python -m numba --sysinfo | tee numba-sysinfo.txt
    - name: Check TBB
      if: inputs.check-tbb == 'true'
      shell: bash
      run: python -m pttools.speedup.tbb
    - name: Generate PTtools reference data
      if: inputs.generate-reference-data == 'true'
      shell: bash
      run: python -m pttools.bubble.fluid_reference
