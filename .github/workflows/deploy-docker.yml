name: Publish Docker image
on:
  release:
    types: [published]
  workflow_dispatch:
# The workflow_run trigger works only on the default branch.
#  workflow_run:
#    workflows: [CI]
#    types: [completed]
jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      contents: read
      packages: write
    steps:
      # The checkout is needed only for using the local action.
      # The image is built from the Git context of the commit, not from the checked-out files.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and push Docker images
        uses: ./.github/actions/deploy-docker
        with:
          dockerhub-image: cfthy/pttools
          dockerhub-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}
          dockerhub-oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
