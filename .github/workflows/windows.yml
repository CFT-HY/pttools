# Reusable workflow, which is called by the CI workflow (main.yml) after the Linux tests with Numba have passed.
# It can also be run manually.
name: Test on Windows
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    # The id-token permission is needed for uploading the coverage to Codecov with OpenID Connect (OIDC).
    # The job-level permissions replace those of the workflow, so contents: read has to be repeated.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    # NumbaLSODA does not provide wheels for recent Python versions, so it's built from source.
    # Its build backend, scikit-build, probes only MSVC-based CMake generators on Windows.
    # Those are rejected here, since $CC and $CXX point to the MinGW toolchain,
    # and the Visual Studio generator does not support Fortran at all,
    # which results in "No CMAKE_Fortran_COMPILER could be found".
    # Selecting a generator that scikit-build does not have built-in defaults for
    # skips the probing entirely and lets CMake use the MinGW toolchain from $FC, $CC and $CXX.
    # The MinGW runtime has to be linked statically, since NumbaLSODA loads its shared libraries
    # with ctypes, which does not search the PATH for their dependencies on Python 3.8 and newer.
    # These are set for the whole job, as the installation of the requirements is done in the setup-env action.
    # CMake is not run in the later steps.
    env:
      CMAKE_GENERATOR: "Ninja Multi-Config"
      CMAKE_ARGS: "-DCMAKE_SHARED_LINKER_FLAGS=-static"
    steps:
        # Fortran compiler is required for building numbalsoda if a wheel is not available
        - name: Install Fortran compiler
          uses: fortran-lang/setup-fortran@v1
          id: setup-fortran
          with:
            # The Intel oneAPI compilers cannot be used on the windows-2025-vs2026 runner image,
            # since their installer requires Visual Studio 2019 or 2022 and the image ships Visual Studio 2026.
            # The installer then crashes with a segmentation fault (exit code 139).
            compiler: "gcc"
            version: "15"
        - name: Checkout
          uses: actions/checkout@v7
        - name: Setup uv and Python environment
          uses: ./.github/actions/setup-env
          # Windows minutes cost 2x what Linux does, so testing multiple Python versions would be quite costly
          with:
            uv-sync-args: --all-extras --no-group docs
            generate-reference-data: true
        - name: Print NumbaLSODA location
          # PTtools falls back to other ODE solvers if NumbaLSODA cannot be imported,
          # so this ensures that a broken NumbaLSODA build fails the workflow instead of being skipped silently.
          run: python -c "import numbalsoda; print(numbalsoda.__file__)"
        - name: Run tests
          uses: ./.github/actions/test
