#          ./gen_call_graphs.sh "ssm" "./pttools/ssm/**.py"
#          ./gen_call_graphs.sh "tests" "./tests/**/*.py"
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Graph
          path: |
            call_graphs
            uml
          if-no-files-found: error
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
      - name: Install requirements
        # Ruff does not import the project, so only the development tools are needed.
        run: uv sync --locked --only-group dev
      - name: Run Ruff
        run: |
          set -o pipefail
          ruff check --output-format=full 2>&1 | tee ruff.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lint
          path: |
            ${{ github.workspace }}/ruff.txt
          if-no-files-found: error
  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
      - name: Install requirements
        run: uv sync --locked --all-extras --no-group docs
      - name: Run Pyrefly
        run: |
          set -o pipefail
          pyrefly check 2>&1 | tee pyrefly.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Pyrefly
          path: |
            ${{ github.workspace }}/pyrefly.txt
          if-no-files-found: error
  test-numba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Read the primary Python version
      id: primary-python
      run: echo "version=$(cat .python-version)" >> "${GITHUB_OUTPUT}"
    - name: Setup uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # This overrides the version of the .python-version file.
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg
    - name: Install requirements
      run: uv sync --locked --all-extras --no-group docs
    - name: Print Numba sysinfo
      # The TBB library of the tbb package is not on the default library search path,
      # so Numba reports it as unavailable here. PTtools loads it from the virtual environment instead,
      # which is verified by the next step.
      run: numba --sysinfo | tee numba-sysinfo.txt
    - name: Check TBB
      run: python -c "from pttools.speedup import tbb; import sys; v = tbb.load_tbb(); print('TBB version:', v); sys.exit(v is None or v < tbb.TBB_MIN_VERSION)"
    - name: Generate reference data
      run: python pttools/bubble/fluid_reference.py
      env:
        PYTHONPATH: .
    - name: Run tests
      run: |
        set -o pipefail
        pytest --store-durations | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version == steps.primary-python.outputs.version }}
      with:
        name: Test results with Numba
        path: |
          .test_durations
          coverage.xml
          coverage.json
          htmlcov
          numba-sysinfo.txt
          test-output.txt
          test-results
        if-no-files-found: error
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Read the primary Python version
      id: primary-python
      run: echo "version=$(cat .python-version)" >> "${GITHUB_OUTPUT}"
    - name: Setup uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # This overrides the version of the .python-version file.
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install requirements
      run: uv sync --locked --all-extras --no-group docs
    - name: Print Numba sysinfo
      # The TBB library of the tbb package is not on the default library search path,
      # so Numba reports it as unavailable here. PTtools loads it from the virtual environment instead,
      # which is verified by the next step.
      run: numba --sysinfo | tee numba-sysinfo.txt
    - name: Check TBB
      run: python -c "from pttools.speedup import tbb; import sys; v = tbb.load_tbb(); print('TBB version:', v); sys.exit(v is None or v < tbb.TBB_MIN_VERSION)"
    - name: Generate reference data
      run: python pttools/bubble/fluid_reference.py
      env:
        PYTHONPATH: .
    - name: Run tests with coverage
      # Without pytest-pythonpath the PYTHONPATH may have to be set manually
      # PYTHONPATH="${PYTHONPATH}${PYTHONPATH:+:}./tests" pytest | tee test-output.txt
      # Coverage of Numba-compiled functions does not get reported
      run: |
        set -o pipefail
        NUMBA_DISABLE_JIT=1 pytest --store-durations | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version == steps.primary-python.outputs.version }}
      with:
        name: Test results without Numba
        path: |
          .test_durations
          coverage.xml
          coverage.json
          htmlcov
          numba-sysinfo.txt
          test-output.txt
          test-results
        if-no-files-found: error
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v7
      if: ${{ matrix.python-version == steps.primary-python.outputs.version }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
