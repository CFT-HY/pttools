name: CI
on: push
permissions:
  contents: read
env:
  PRIMARY_PYTHON_VERSION: '3.14'
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
      - name: Print Python version
        run: uv python find --show-version
      - name: Build
        run: uv build
      - name: Run Twine checks
        run: uvx twine check dist/*
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Python packages
          path: dist
          if-no-files-found: error
  cloc:
    # The djdefi/cloc-action does not run on ubuntu-slim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Count Lines of Code (cloc) for the PTtools library
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }}/pttools --by-file-by-lang --vcs=git
      - name: Count Lines of Code (cloc) for the repository
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }} --by-file-by-lang --vcs=git
