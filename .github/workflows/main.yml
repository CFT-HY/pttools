name: CI
on: push
permissions:
  contents: read
# The primary Python version is specified in the .python-version file, which uv reads automatically.
# The test jobs also test the other supported Python versions, and upload the results only for the primary one.
#
# The reusable workflows and the setup-env action are referenced with local paths,
# so that the CI always uses their versions of the current commit.
# Other repositories, such as PTPlot, use them from the dev branch, e.g. CFT-HY/pttools/.github/workflows/lint.yml@dev.
#
# Job dependencies:
# lint -> build, docs, graph, test-numba, test-python
# test-numba -> test-windows, test-macos
jobs:
  build:
    needs: lint
    uses: ./.github/workflows/build.yml
#  fossa:
#    runs-on: ubuntu-latest
#    timeout-minutes: 5
#    steps:
#      - name: Checkout
#        uses: actions/checkout@v7
#      - name: Setup uv and Python environment
#        uses: ./.github/actions/setup-env
#        with:
#          uv-sync-args: --all-extras --no-default-groups
#      - name: Install FOSSA
#        run: |
#          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install.sh | sudo bash
#      - name: Run FOSSA
#        run: fossa analyze
#        env:
#          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
  docs:
    # This lints the documentation without running the examples, and then builds the full documentation.
    needs: lint
    uses: ./.github/workflows/docs.yml
    with:
      uv-sync-args: --all-extras
      timeout-minutes: 60
  graph:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Setup uv and Python environment
        uses: ./.github/actions/setup-env
        with:
          uv-sync-args: --all-extras --no-group docs
      - name: Run Pyreverse
        run: |
          mkdir uml
          pyreverse pttools -o png -d ./uml
          pyreverse pttools -o svg -d ./uml
#      - name: Run Pyan
#        continue-on-error: true
#        run: |
#          ./gen_call_graphs.sh "all" "./**/*.py"
#          ./gen_call_graphs.sh "bubble" "./pttools/bubble/**.py"
#          ./gen_call_graphs.sh "pttools" "./pttools/**.py"
#          ./gen_call_graphs.sh "pttools_tests" "./pttools/**.py" "./pttools/**/*.py" "./tests/**.py"
#          ./gen_call_graphs.sh "ssm" "./pttools/ssm/**.py"
#          ./gen_call_graphs.sh "tests" "./tests/**/*.py"
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Graph
          path: |
            call_graphs
            uml
          if-no-files-found: error
  lint:
    uses: ./.github/workflows/lint.yml
  test-macos:
    needs: test-numba
    uses: ./.github/workflows/mac.yml
  test-numba:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Read the primary Python version
      id: primary-python
      run: echo "version=$(cat .python-version)" >> "${GITHUB_OUTPUT}"
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg
    - name: Setup uv and Python environment
      uses: ./.github/actions/setup-env
      with:
        python-version: ${{ matrix.python-version }}
        uv-sync-args: --all-extras --no-group docs
    - name: Print Numba sysinfo
      # The TBB library of the tbb package is not on the default library search path,
      # so Numba reports it as unavailable here. PTtools loads it from the virtual environment instead,
      # which is verified by the next step.
      run: numba --sysinfo | tee numba-sysinfo.txt
    - name: Check TBB
      run: python -c "from pttools.speedup import tbb; import sys; v = tbb.load_tbb(); print('TBB version:', v); sys.exit(v is None or v < tbb.TBB_MIN_VERSION)"
    - name: Generate reference data
      run: python pttools/bubble/fluid_reference.py
      env:
        PYTHONPATH: .
    - name: Run tests
      run: |
        set -o pipefail
        pytest --store-durations | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version == steps.primary-python.outputs.version }}
      with:
        name: Test results with Numba
        path: |
          .test_durations
          coverage.xml
          coverage.json
          htmlcov
          numba-sysinfo.txt
          test-output.txt
          test-results
        if-no-files-found: error
  test-python:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Read the primary Python version
      id: primary-python
      run: echo "version=$(cat .python-version)" >> "${GITHUB_OUTPUT}"
    - name: Setup uv and Python environment
      uses: ./.github/actions/setup-env
      with:
        python-version: ${{ matrix.python-version }}
        uv-sync-args: --all-extras --no-group docs
    - name: Print Numba sysinfo
      # The TBB library of the tbb package is not on the default library search path,
      # so Numba reports it as unavailable here. PTtools loads it from the virtual environment instead,
      # which is verified by the next step.
      run: numba --sysinfo | tee numba-sysinfo.txt
    - name: Check TBB
      run: python -c "from pttools.speedup import tbb; import sys; v = tbb.load_tbb(); print('TBB version:', v); sys.exit(v is None or v < tbb.TBB_MIN_VERSION)"
    - name: Generate reference data
      run: python pttools/bubble/fluid_reference.py
      env:
        PYTHONPATH: .
    - name: Run tests with coverage
      # Without pytest-pythonpath the PYTHONPATH may have to be set manually
      # PYTHONPATH="${PYTHONPATH}${PYTHONPATH:+:}./tests" pytest | tee test-output.txt
      # Coverage of Numba-compiled functions does not get reported
      run: |
        set -o pipefail
        NUMBA_DISABLE_JIT=1 pytest --store-durations | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version == steps.primary-python.outputs.version }}
      with:
        name: Test results without Numba
        path: |
          .test_durations
          coverage.xml
          coverage.json
          htmlcov
          numba-sysinfo.txt
          test-output.txt
          test-results
        if-no-files-found: error
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v7
      if: ${{ matrix.python-version == steps.primary-python.outputs.version }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  test-windows:
    needs: test-numba
    uses: ./.github/workflows/windows.yml
  typecheck:
    uses: ./.github/workflows/typecheck.yml
