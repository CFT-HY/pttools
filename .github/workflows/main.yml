name: CI
on: push
permissions:
  contents: read
# The primary Python version is specified in the .python-version file, which uv reads automatically.
# The test jobs also test the other supported Python versions, and upload the results only for the primary one.
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build
        run: uv build
      - name: Run Twine checks
        run: uvx twine check dist/*
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Python packages
          path: dist
          if-no-files-found: error
  cloc:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc
      - name: Count Lines of Code (cloc) for the PTtools library
        run: ./cloc.sh --library
      - name: Count Lines of Code (cloc) for the repository
        run: ./cloc.sh
