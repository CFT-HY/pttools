#          ./gen_call_graphs.sh "bubble" "./pttools/bubble/**.py"
#          ./gen_call_graphs.sh "pttools" "./pttools/**.py"
#          ./gen_call_graphs.sh "pttools_tests" "./pttools/**.py" "./pttools/**/*.py" "./tests/**.py"
#          ./gen_call_graphs.sh "ssm" "./pttools/ssm/**.py"
#          ./gen_call_graphs.sh "tests" "./tests/**/*.py"
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Graph
          path: |
            call_graphs
            uml
          if-no-files-found: error
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
          activate-environment: true
      - name: Install requirements
        # Ruff does not import the project, so only the development tools are needed.
        run: uv sync --locked --only-group dev
      - name: Print Python version
        run: python -V
      - name: Run Ruff
        run: ruff check --output-format=full 2>&1 | tee ruff.txt
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Lint
          path: |
            ${{ github.workspace }}/ruff.txt
          if-no-files-found: error
  pyrefly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
          activate-environment: true
      - name: Install requirements
        run: uv sync --locked --all-extras --no-group docs
      - name: Print Python version
        run: python -V
      - name: Run Pyrefly
        run: pyrefly check 2>&1 | tee pyrefly.txt
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Pyrefly
          path: |
            ${{ github.workspace }}/pyrefly.txt
          if-no-files-found: error
  test-numba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg
    - name: Install requirements
      run: uv sync --locked --all-extras --no-group docs
    - name: Print Python version
      run: python -V
    - name: Print Numba sysinfo
      run: numba --sysinfo | tee numba-sysinfo.txt
    - name: Generate reference data
      run: python pttools/bubble/fluid_reference.py
      env:
        PYTHONPATH: .
    - name: Run tests
      run: |
        set -o pipefail
        pytest --store-durations | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version == env.PRIMARY_PYTHON_VERSION }}
      with:
        name: Test results with Numba
        path: |
          .test_durations
          coverage.xml
          coverage.json
          htmlcov
          numba-sysinfo.txt
          test-output.txt
          test-results
        if-no-files-found: error
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install requirements
      run: uv sync --locked --all-extras --no-group docs
    - name: Print Python version
      run: python -V
    - name: Print Numba sysinfo
      run: numba --sysinfo | tee numba-sysinfo.txt
    - name: Generate reference data
      run: python pttools/bubble/fluid_reference.py
      env:
        PYTHONPATH: .
    - name: Run tests with coverage
      # Without pytest-pythonpath the PYTHONPATH may have to be set manually
      # PYTHONPATH="${PYTHONPATH}${PYTHONPATH:+:}./tests" pytest | tee test-output.txt
      # Coverage of Numba-compiled functions does not get reported
      run: |
        set -o pipefail
        NUMBA_DISABLE_JIT=1 pytest --store-durations | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version == env.PRIMARY_PYTHON_VERSION }}
      with:
        name: Test results without Numba
        path: |
          .test_durations
          coverage.xml
          coverage.json
          htmlcov
          numba-sysinfo.txt
          test-output.txt
          test-results
        if-no-files-found: error
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v7
      if: ${{ matrix.python-version == env.PRIMARY_PYTHON_VERSION }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
