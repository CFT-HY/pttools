name: CI
on:
  push:
  # The push event does not run the CI for pull requests from forks.
  pull_request:
permissions:
  contents: read
# The primary Python version is specified in the .python-version file, which uv reads automatically.
# The test jobs also test the other supported Python versions, and upload the results only for the primary one.
#
# The reusable workflows and the setup-env action are referenced with local paths,
# so that the CI always uses their versions of the current commit.
# Other repositories, such as PTPlot, use them from the dev branch, e.g. CFT-HY/pttools/.github/workflows/lint.yml@dev.
#
# Job dependencies:
# build, lint, typecheck -> docs, graph, test-arm, test-numba, test-python
# test-numba -> test-windows, test-macos
# test-arm, test-numba, test-python -> deploy-docker
# all the other jobs -> deploy-pypi, deploy-shf, which are run only for version tags, e.g. when a release is created
jobs:
  build:
    # The pull requests from the branches of this repository are already tested by the push event,
    # so the pull_request event runs the CI only for pull requests from forks.
    # The other jobs depend on this one, and are therefore skipped as well.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/build.yml
#  fossa:
#    runs-on: ubuntu-latest
#    timeout-minutes: 5
#    steps:
#      - name: Checkout
#        uses: actions/checkout@v7
#      - name: Setup uv and Python environment
#        uses: ./.github/actions/setup-env
#        with:
#          uv-sync-args: --all-extras --no-default-groups
#      - name: Install FOSSA
#        run: |
#          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install.sh | sudo bash
#      - name: Run FOSSA
#        run: fossa analyze
#        env:
#          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
  deploy-docker:
    # The Docker image is built and pushed for every commit that passes the tests.
    # The image tags are generated by docker/metadata-action: a branch push is tagged with the name of the branch,
    # and a tag push, e.g. from creating a release, with the name of the tag and "latest".
    needs: [test-arm, test-numba, test-python]
    # The image is not pushed for pull requests.
    # Workflows triggered by Dependabot get only a read-only token, with which the image cannot be pushed.
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    # If a newer commit of the same branch or tag reaches this job, the build of the older commit is cancelled,
    # so that the older image does not overwrite the newer one if it finishes later.
    concurrency:
      group: deploy-docker-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      contents: read
      packages: write
    steps:
      # The checkout is needed only for using the local action.
      # The image is built from the Git context of the commit, not from the checked-out files.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and push Docker images
        uses: ./.github/actions/deploy-docker
        with:
          dockerhub-image: cfthy/pttools
          dockerhub-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}
          dockerhub-oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
  deploy-pypi:
    # The packages are published only for version tags, e.g. when a release is created,
    # and only if all the other jobs have passed, so that the published packages have been tested.
    # The packages are those built by the build job of this workflow run.
    # The PyPI trusted publisher has to be configured for this workflow file (main.yml) and the pypi environment.
    # Trusted publishing does not support reusable workflows or composite actions,
    # so this job has to be in the top-level workflow.
    needs: &all-jobs
      - build
      - deploy-docker
      - docs
      - graph
      - lint
      - test-arm
      - test-macos
      - test-numba
      - test-python
      - test-windows
      - typecheck
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The pypa/gh-action-pypi-publish action is Docker-based, and therefore cannot be run on ubuntu-slim.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # https://github.com/marketplace/actions/pypi-publish
    environment:
      name: pypi
      url: https://pypi.org/p/pttools-gw
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: Python packages
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # An API token is not needed with trusted publishing (OpenID Connect)
        # with:
        #   user: __token__
        #   password: ${{ secrets.PYPI_API_TOKEN }}
  deploy-shf:
    # The repository is saved to the Software Heritage archive for version tags, e.g. when a release is created,
    # and only if all the other jobs have passed.
    needs: *all-jobs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-shf.yml
  docs:
    # This lints the documentation without running the examples, and then builds the full documentation.
    needs: [build, lint, typecheck]
    uses: ./.github/workflows/docs.yml
    with:
      uv-sync-args: --all-extras
      timeout-minutes: 60
  graph:
    needs: [build, lint, typecheck]
    uses: ./.github/workflows/graph.yml
    with:
      target: pttools
  lint:
    # The pull requests from the branches of this repository are already tested by the push event,
    # so the pull_request event runs the CI only for pull requests from forks.
    # The other jobs depend on this one, and are therefore skipped as well.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/lint.yml
  test-arm:
    needs: [build, lint, typecheck]
    # This is the same as test-numba, but on ARM, and only for the primary Python version of .python-version.
    # The tbb package is not available for ARM, so the TBB check of setup-env only prints a note.
    runs-on: ubuntu-26.04-arm
    # The id-token permission is needed for uploading the coverage to Codecov with OpenID Connect (OIDC).
    # The job-level permissions replace those of the workflow, so contents: read has to be repeated.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup uv and Python environment
      uses: ./.github/actions/setup-env
      with:
        # Kaleido needs Chrome for exporting Plotly figures, and Chrome is not included in the ARM runner image.
        apt-packages: ffmpeg https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
        uv-sync-args: --all-extras --no-group docs
        generate-reference-data: true
    - name: Run tests
      uses: ./.github/actions/test
  test-macos:
    needs: test-numba
    # A called workflow cannot have more permissions than its caller,
    # so the id-token permission for uploading the coverage to Codecov has to be granted here.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mac.yml
  test-numba:
    needs: [build, lint, typecheck]
    runs-on: ubuntu-latest
    # The id-token permission is needed for uploading the coverage to Codecov with OpenID Connect (OIDC).
    # The job-level permissions replace those of the workflow, so contents: read has to be repeated.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Read the primary Python version
      id: primary-python
      run: echo "version=$(cat .python-version)" >> "${GITHUB_OUTPUT}"
    - name: Setup uv and Python environment
      uses: ./.github/actions/setup-env
      with:
        apt-packages: ffmpeg
        python-version: ${{ matrix.python-version }}
        uv-sync-args: --all-extras --no-group docs
        generate-reference-data: true
    - name: Run tests
      uses: ./.github/actions/test
      with:
        upload-results: ${{ matrix.python-version == steps.primary-python.outputs.version }}
  test-python:
    needs: [build, lint, typecheck]
    runs-on: ubuntu-latest
    # The id-token permission is needed for uploading the coverage to Codecov with OpenID Connect (OIDC).
    # The job-level permissions replace those of the workflow, so contents: read has to be repeated.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']  # '3.14t'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Read the primary Python version
      id: primary-python
      run: echo "version=$(cat .python-version)" >> "${GITHUB_OUTPUT}"
    - name: Setup uv and Python environment
      uses: ./.github/actions/setup-env
      with:
        python-version: ${{ matrix.python-version }}
        uv-sync-args: --all-extras --no-group docs
        generate-reference-data: true
    - name: Run tests without Numba
      # The coverage of Numba-compiled functions is reported only when the JIT compilation is disabled.
      uses: ./.github/actions/test
      with:
        numba-disable-jit: true
        upload-results: ${{ matrix.python-version == steps.primary-python.outputs.version }}
  test-windows:
    needs: test-numba
    # A called workflow cannot have more permissions than its caller,
    # so the id-token permission for uploading the coverage to Codecov has to be granted here.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows.yml
  typecheck:
    # The pull requests from the branches of this repository are already tested by the push event,
    # so the pull_request event runs the CI only for pull requests from forks.
    # The other jobs depend on this one, and are therefore skipped as well.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/typecheck.yml
