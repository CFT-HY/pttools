# Reusable workflow, which is called by the CI workflow (main.yml) after the Linux tests with Numba have passed.
# It can also be run manually.
name: Test on macOS
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
        # Fortran compiler is required for building numbalsoda if a wheel is not available
        - name: Install Fortran compiler
          uses: fortran-lang/setup-fortran@v1
          id: setup-fortran
          with:
            compiler: "gcc"
            version: "15"
        - name: Checkout
          uses: actions/checkout@v7
        - name: Setup uv and Python environment
          uses: ./.github/actions/setup-env
          # macOS minutes cost 10x what Linux does, so testing multiple Python versions would be quite costly.
          with:
            uv-sync-args: --all-extras --no-group docs
        - name: Print Numba sysinfo
          # On macOS the Numba script is not executable by default and therefore has to be called as a Python module.
          run: |
            python -m numba --sysinfo | tee numba-sysinfo.txt
        - name: Generate reference data
          run: python pttools/bubble/fluid_reference.py
          env:
            PYTHONPATH: .
        - name: Run tests
          run: |
            set -o pipefail
            NUMBA_NESTED_PARALLELISM=0 pytest | tee test-output.txt
            coverage json
        - name: Upload results
          uses: actions/upload-artifact@v7
          with:
            # The artifact names have to be unique within the workflow run of the CI workflow.
            name: Test results with Numba on macOS
            path: |
              coverage.xml
              coverage.json
              htmlcov
              numba-sysinfo.txt
              test-output.txt
              test-results
            if-no-files-found: error
