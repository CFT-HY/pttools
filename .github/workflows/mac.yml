name: Test on macOS
on:
  push:
  workflow_dispatch:
#  workflow_run:
#    workflows: [ CI ]
#    types: [ completed ]
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.14"
jobs:
  test:
    runs-on: macos-latest
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    steps:
        # Fortran compiler is required for building numbalsoda if a wheel is not available
        - name: Install Fortran compiler
          uses: fortran-lang/setup-fortran@v1
          id: setup-fortran
          with:
            compiler: "gcc"
            version: "15"
        - name: Checkout
          uses: actions/checkout@v7
        - name: Setup uv
          uses: astral-sh/setup-uv@v10
          # macOS minutes cost 10x what Linux does, so testing multiple Python versions would be quite costly.
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            activate-environment: true
        - name: Install requirements
          run: uv sync --locked --all-extras --no-group docs
        - name: Print Python version
          run: python -V
        - name: Print Numba sysinfo
          # On macOS the Numba script is not executable by default and therefore has to be called as a Python module.
          run: |
            python -m numba --sysinfo | tee numba-sysinfo.txt
        - name: Generate reference data
          run: python pttools/bubble/fluid_reference.py
          env:
            PYTHONPATH: .
        - name: Run tests
          run: |
            set -o pipefail
            NUMBA_NESTED_PARALLELISM=0 pytest | tee test-output.txt
            coverage json
        - name: Upload results
          uses: actions/upload-artifact@v7
          with:
            name: Test results with Numba
            path: |
              coverage.xml
              coverage.json
              htmlcov
              numba-sysinfo.txt
              test-output.txt
              test-results
            if-no-files-found: error
