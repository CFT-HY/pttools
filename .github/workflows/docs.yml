# Reusable workflow for linting and building the documentation with the given make targets,
# which is called by the CI workflow (main.yml),
# and by other repositories, such as PTPlot (CFT-HY/pttools/.github/workflows/docs.yml@dev).
# It can also be run manually.
# The setup steps are not taken from the setup-env action of this repository,
# since a local action reference (./.github/actions/setup-env) would point to the repository of the caller.
name: Docs
on:
  workflow_call:
    inputs: &inputs
      apt-packages:
        description: >-
          Additional apt packages to install, separated by spaces,
          in addition to those required by all the repositories that use this workflow
        type: string
        required: false
        default: ""
      lint:
        description: >-
          The make target in the docs directory that is run first to lint the documentation.
          The default "latexpdf-noplot" builds the PDF without running the examples,
          and therefore finds the Sphinx and LaTeX errors faster than the full build.
          An empty string skips the linting.
        type: string
        required: false
        default: latexpdf-noplot
      linkcheck:
        description: >-
          The make target in the docs directory that checks the links after the linting.
          The broken and timed out links are reported as warnings instead of failing the job,
          as they are often caused by temporary problems of the linked servers.
          The other errors of the link check still fail the job.
          The link check of the build target is then skipped with SKIP_LINKCHECK=1,
          which the "all" targets of the Makefiles of PTtools and PTPlot support.
          The default "linkcheck-noplot" checks the links without running the examples.
          An empty string skips this, and the links are then checked by the build target, if at all.
        type: string
        required: false
        default: linkcheck-noplot
      target:
        description: >-
          The make target in the docs directory that is run after the linting has passed.
          The default "all" builds the full documentation. An empty string skips the build.
        type: string
        required: false
        default: all
      timeout-minutes:
        description: The timeout of the job
        type: number
        required: false
        default: 30
      uv-sync-args:
        description: Additional arguments for "uv sync --locked", e.g. "--all-extras"
        type: string
        required: false
        default: ""
  # The inputs are defined also for the manual runs,
  # since otherwise the inputs would be empty instead of having the default values.
  workflow_dispatch:
    inputs: *inputs
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install LaTeX and the other build tools
        # These are the packages required by all the repositories that use this workflow,
        # followed by the additional packages of the caller.
        run: |
          sudo apt-get update
          # APT_PACKAGES is intentionally unquoted to split it into separate arguments.
          # shellcheck disable=SC2086
          sudo apt-get install -y cloc cm-super dvipng ffmpeg fontconfig graphviz latexmk optipng texlive-latex-extra texlive-xetex fonts-freefont-otf xindy ${APT_PACKAGES}
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
      - name: Print uv and Python versions
        run: |
          echo "uv ${UV_VERSION}"
          echo "Python ${PYTHON_VERSION}"
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
          PYTHON_VERSION: ${{ steps.setup-uv.outputs.python-version }}
      - name: Install requirements
        run: |
          # SYNC_ARGS is intentionally unquoted to split it into separate arguments.
          # shellcheck disable=SC2086
          uv sync --locked ${SYNC_ARGS}
        env:
          SYNC_ARGS: ${{ inputs.uv-sync-args }}
      - name: Print Numba sysinfo
        # The SVML and TBB libraries of the PyPI packages are not on the default library search path,
        # so Numba reports them as unavailable here, unless they are also installed system-wide.
        # PTtools loads them from the virtual environment instead, which is verified by the next step.
        run: python -m numba --sysinfo | tee numba-sysinfo.txt
      - name: Check native libraries
        # Other repositories, such as PTPlot, may use a version of PTtools
        # from before pttools.speedup.tbb was replaced by pttools.speedup.libraries.
        run: |
          if python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pttools.speedup.libraries') is None)"; then
            python -m pttools.speedup.libraries
          else
            python -m pttools.speedup.tbb
          fi
      # The database steps are run only for Django projects, such as PTPlot.
      - name: Create migrations
        if: hashFiles('manage.py') != ''
        run: python manage.py makemigrations
      - name: Migrate database
        if: hashFiles('manage.py') != ''
        run: python manage.py migrate
      - name: Populate database
        if: hashFiles('manage.py') != ''
        run: python manage.py populate
      - name: Generate PTtools reference data
        run: python -m pttools.bubble.fluid_reference
      # These print the output of make while it runs, followed by a summary of the Sphinx and LaTeX errors.
      - name: Lint documentation
        if: inputs.lint != ''
        run: python -m pttools.docs.lint --verbose --target "${LINT}"
        env:
          LINT: ${{ inputs.lint }}
      - name: Check links
        id: linkcheck
        if: inputs.linkcheck != ''
        run: |
          # Other repositories, such as PTPlot, may use a version of PTtools that does not have this option.
          # Then the links are checked by the build target, and the broken links fail the job.
          if python -m pttools.docs.lint --help | grep -q -- "--broken-links-as-warnings"; then
            python -m pttools.docs.lint --verbose --target "${LINKCHECK}" --broken-links-as-warnings
            echo "checked=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=Link check::This version of PTtools does not support reporting broken links as warnings, so the links are checked by the build target."
          fi
        env:
          LINKCHECK: ${{ inputs.linkcheck }}
      - name: Build documentation
        if: inputs.target != ''
        run: python -m pttools.docs.lint --verbose --target "${TARGET}"
        env:
          TARGET: ${{ inputs.target }}
          # The links have already been checked by the previous step.
          SKIP_LINKCHECK: ${{ steps.linkcheck.outputs.checked == 'true' && '1' || '' }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The artifact names have to be unique within the workflow run of the caller.
          name: Documentation (make ${{ inputs.target }})
          path: |
            docs/_build
            logs
            numba-sysinfo.txt
          if-no-files-found: warn
