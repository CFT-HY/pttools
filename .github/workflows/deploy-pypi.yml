name: Publish PyPI package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  deploy-pypi:
    needs: build
    # The pypa/gh-action-pypi-publish action is Docker-based, and therefore cannot be run on ubuntu-slim.
    # Trusted publishing does not support reusable workflows or composite actions,
    # so this job has to be in the top-level workflow of each repository.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # https://github.com/marketplace/actions/pypi-publish
    environment:
      name: pypi
      url: https://pypi.org/p/pttools-gw
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: Python packages
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # An API token is not needed with trusted publishing (OpenID Connect)
        # with:
        #   user: __token__
        #   password: ${{ secrets.PYPI_API_TOKEN }}
