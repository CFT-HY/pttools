# This workflow is also called as a reusable workflow by other repositories,
# such as PTPlot (CFT-HY/pttools/.github/workflows/deploy-shf.yml@dev).
# The saved repository is that of the caller.
name: Publish to Software Heritage Foundation
on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-shf:
    # The sdruskat/swh-save-action action is Docker-based, and therefore cannot be run on ubuntu-slim.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # https://github.com/marketplace/actions/save-to-software-heritage
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Publish to Software Heritage Foundation
        uses: sdruskat/swh-save-action@v1.0.1
